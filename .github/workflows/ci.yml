name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Every `uv run` fails if uv.lock is out of date, so no separate dependency check is needed.
env:
  UV_LOCKED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Check formatting and style
        run: just lint

      - name: Check types
        run: just type

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: wicket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The tests make a database of their own on this server and drop it at the end.
      WICKET_POSTGRES_URL: postgresql://postgres:wicket@localhost:5432/postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Run tests
        run: just test

  # Windows and macOS runners have no service containers and no Linux Docker: the PostgreSQL tests
  # are skipped there, and the rest run as on Ubuntu.
  test-other-systems:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.14'

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Run tests
        run: just test
